name: Auto Generate Index
on:
  push:
    paths: 
      - 'public/posts/*.json' # jalan kalau ada .json yg berubah
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Markdown
        run: pip install markdown
      - name: Run generate.py
        run: python generate.py
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/posts/index.json public/posts.js public/berita/*.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: update index & html"
          git push
