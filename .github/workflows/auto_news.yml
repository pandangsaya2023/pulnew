name: Robot Ambil Berita Otomatis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */23 * * *'

permissions:
    contents: write
    actions: write # biar bisa hapus run lama

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Menyiapkan Python & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 groq
          pip install requests openai beautifulsoup4 lxml

      - name: Jalankan Robot Pengambil Berita
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python ambil_berita.py

      - name: Menyimpan Perubahan Kembali ke GitHub
        run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/posts/ public/posts.js
            git diff-index --quiet HEAD || git commit -m "Update berita otomatis"
            git pull --rebase origin main || true
            git push

      - name: Hapus Workflow Runs Lama # TAMBAH INI DI AKHIR
        uses: Mattraks/delete-workflow-runs@v2
        with:
            token: ${{ github.token }}
            repository: ${{ github.repository }}
            retain_days: 3 # simpan 3 hari terakhir aja
            keep_minimum_runs: 5 # minimal simpan 5 run terakhir
