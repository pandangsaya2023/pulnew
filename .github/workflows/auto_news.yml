name: Robot Ambil Berita Otomatis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */23 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Menyiapkan Python & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 groq
          pip install requests openai beautifulsoup4 lxml

      - name: Jalankan Robot Pengambil Berita
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python ambil_berita.py

      - name: Bersihkan posts.js dari file yg hilang
        run: |
          python -c "
          import json, os
          with open('public/posts.js') as f: urls = json.load(f)
          valid = [u for u in urls if os.path.exists('public' + u)]
          with open('public/posts.js','w') as f: json.dump(valid, f)
          print('Dibersihkan:', len(urls)-len(valid), 'link mati')
          "

          - name: HAPUS SEMUA FILE BERTANGGAL
            run: |
            cd public/posts
            rm -f 20*-*.json # hapus semua file yg depannya 2025- 2026- dll
            echo "File lama dihapus"

          - name: Menyimpan Perubahan Kembali ke GitHub
            run: |
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/posts/ public/posts.js
            git diff-index --quiet HEAD || git commit -m "Update berita otomatis"
            git pull --rebase origin main || true
            git push
