name: Robot Ambil Berita Otomatis
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */7 * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Menyiapkan Python & Dependencies
        run: |
          python -m pip install --upgrade pip
          # pip install requests openai beautifulsoup4 lxml
          pip install requests groq beautifulsoup4 lxml python-dotenv
          import os
          import json
          import requests
          from datetime import datetime
          from groq import Groq

      - name: Jalankan Robot Pengambil Berita
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/ambil_berita.py

      - name: Menyimpan Perubahan Kembali ke GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pastikan folder-folder ada (jika belum ada, buat agar tidak error saat add)
          mkdir -p public/posts
          mkdir -p public/berita
          mkdir -p public/images
          # Tambahkan folder 'berita' secara eksplisit disini
          git add public/posts/ public/berita/
          # Commit hanya jika ada perubahan
          git diff-index --quiet HEAD || git commit -m "Update berita otomatis dan file preview"
          git pull --rebase origin main || true
          git push
