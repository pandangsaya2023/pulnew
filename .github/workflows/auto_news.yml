name: Robot Ambil Berita Otomatis
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */7 * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
        contents: write
    
    steps:
      - name: Chekout Repo
        uses: actions/checkout@v4

      - name: Menyiapkan Python & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai beautifulsoup4 lxml pyhthon-frontmatter

      - name: Jalankan Robot Pengambil Berita
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python ambil_berita.py

      - name: Jakankan Robot Sync Sveltia ke JSON
        run: python sync_sveltia.py

      - name: Menyimpan Perubahan Kembali ke GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Cuma add 1 file saja
          git add posts.json content/berita/
    
          # Commit hanya jika ada perubahan
          git diff --staged --quiet || git commit -m "Update berita otomatis + Sync Ssveltia : $(date +'%Y-%M-%D %H:%M')"
          git pull --rebase origin main
          git push
