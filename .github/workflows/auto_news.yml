name: Robot Ambil Berita Otomatis
on:
  workflow_dispatch: # biar bisa pencet manual
  schedule:
    - cron: '0 */6 * *' # ganti: jalan tiap 6 jam. yg lama 7 hari sekali kelamaan

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Menyiapkan Python & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests groq beautifulsoup4 lxml python-dotenv
          
      - name: Jalankan Robot Pengambil Berita
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python ambil_berita.py

      - name: Menyimpan Perubahan Kembali ke GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 1. Buat folder data kalau belum ada
          mkdir -p data
          
          # 2. ADD CUMA 1 FILE INI
          git add data/posts.json
          
          # 3. Commit hanya jika ada perubahan
          git diff-index --quiet HEAD || git commit -m "Update berita otomatis - $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push
