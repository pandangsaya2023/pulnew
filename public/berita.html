<!DOCTYPE html>
<html lang="id">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8902628805606588" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memuat... - PULNEW.com</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<meta property="og:site_name" content="PULNEW.COM">
<meta property="og:title" content="PULNEW.COM">
<meta property="og:description" content="Menyajikan Informasi Langsung Ke Perangkat Anda">
<meta property="og:image" content="https://pulnew.pages.dev/logopulnew.png">
<meta property="og:url" content="https://pulnew.pages.dev">
<meta property="og:type" content="article">
<meta name="twitter:card" content="summary_large_image">
   
<style>
:root { --jarak-utama: 8px; --warna-merah: #d32f2f; --warna-biru: #1a237e; --warna-bg: #f4f6f9; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; }
html, body { background: var(--warna-bg); color: #333; min-height: 100vh; padding-bottom: 10px; }
h1, h2, h3, h4,.logo-text { font-family: 'Poppins', sans-serif; }
.header-container { background: #ffffff; position: sticky; top: 0; z-index: 999; border-bottom: 2px solid var(--warna-merah); }
.logo-bar { max-width: 1100px; margin: 0 auto; padding: 7px 20px; display: flex; justify-content: space-between; align-items: center; }
.logo-bar > a { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-img-wrapper img { display: block; max-height: 45px; width: auto; }
.logo-text { font-size: 24px; font-weight: 800; color: var(--warna-biru); }
.logo-new { color: var(--warna-merah); }
.btn-beranda { background: #2e7d32; color: white; padding: 4px 12px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 12px; }
.content-wrapper { padding: 0; }
.article-box { max-width: 100%; margin: 0; background: white; padding: 16px; }
.article-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
.article-meta { font-size: 12px; color: #666; margin-bottom: 15px; }
.main-image { width: 100%; border-radius: 8px; margin-bottom: 10px; }
.share-article { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.share-article a,.share-article button { font-size: 10px; padding: 8px 12px; border-radius: 8px; color: white; text-decoration: none; display: flex; align-items: center; gap: 6px; border: none; cursor: pointer; font-weight: 600; }
.share-wa { background: #25D366; }
.share-fb { background: #1877F2; }
.share-copy { background: #1a237e; }
.article-body { font-size: 16px; line-height: 1.8; }
.loading,.error { text-align:center; padding:60px 20px; }
.error { color: var(--warna-merah); }
</style>
</head>

<body>
<div class="header-container">
<div class="logo-bar">
<a href="https://pulnew.pages.dev/">
<div class="logo-img-wrapper"><img src="https://pulnew.pages.dev/logopulnew.png" alt="Logo"></div>
<div class="logo-text">PUL<span class="logo-new">NEW</span>.COM</div>
</a>
<a href="https://pulnew.pages.dev/" class="btn-beranda">← Beranda</a>
</div>
</div>

<div class="content-wrapper"><div class="article-box" id="content-area"><div class="loading">Memuat berita...</div></div></div>

<script>
function getSlugFromURL() {
    const path = window.location.pathname; 
    const slug = path.split('/').pop().replace('.html', ''); 
    return slug;
}

function updateMetaTags(post) {
    const linkBerita = window.location.href;
    const desc = (post.content || post.body || '').substring(0, 160).replace(/<[^>]*>/g, '').trim() + '...';
    const image = post.image || 'https://pulnew.pages.dev/logopulnew.png';
    document.title = post.title + " - PULNEW.com";

    const setMeta = (property, content) => {
        let meta = document.querySelector(`meta[property="${property}"]`);
        if (meta) meta.setAttribute('content', content);
    };
    setMeta('og:title', post.title);
    setMeta('og:description', desc);
    setMeta('og:image', image);
    setMeta('og:url', linkBerita);
}

async function fetchPostDetail(slug) {
    try {
        const res = await fetch(`/posts/${slug}.json?t=` + Date.now());
        if(!res.ok) throw new Error("File JSON tidak ditemukan");
        return await res.json();
    } catch(e) { 
        console.error(e);
        return null; 
    }
}

async function muatHalamanBerita() {
    const slugTujuan = getSlugFromURL(); 
    const contentArea = document.getElementById('content-area');
    
    if (!slugTujuan || slugTujuan === 'berita') {
        contentArea.innerHTML = `<div class="error">404 - Link Tidak Valid<br><a href="/">Kembali ke Beranda</a></div>`;
        return;
    }

    const post = await fetchPostDetail(slugTujuan);
    if(!post) {
        contentArea.innerHTML = `<div class="error">Gagal memuat berita. Cek file /posts/${slugTujuan}.json ada gak?<br><a href="/">← Kembali</a></div>`;
        return;
    }

    updateMetaTags(post);

    const tanggal = new Date(post.date).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + " WIB";
    const isiBerita = post.content || post.body || '';
    const linkBerita = window.location.href;
    const textShare = encodeURIComponent(post.title + ' - ' + linkBerita);

    contentArea.innerHTML = `
        <h1 class="article-title">${post.title}</h1>
        <div class="article-meta">${tanggal} | ${(post.kategori||'BERITA').toUpperCase()}</div>
        <img src="${post.image}" class="main-image" alt="${post.title}">
        <div class="share-article">
            <a href="https://wa.me/?text=${textShare}" target="_blank" class="share-wa"><i class="fab fa-whatsapp"></i> WhatsApp</a>
            <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(linkBerita)}" target="_blank" class="share-fb"><i class="fab fa-facebook"></i> Facebook</a>
            <button onclick="navigator.clipboard.writeText('${linkBerita}'); alert('Link disalin')" class="share-copy"><i class="fas fa-link"></i> Salin Link</button>
        </div>
        <div class="article-body">${isiBerita}</div>
    `;
}

document.addEventListener('DOMContentLoaded', muatHalamanBerita);
</script>
</body>
</html>
