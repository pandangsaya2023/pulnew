<body>
    <div class="header-container">
        <div class="logo-bar">
            <a href="https://pulnew.pages.dev/">
              <div class="logo-img-wrapper"><img src="https://pulnew.pages.dev/logopulnew.png" alt="Logo"></div>
              <div class="logo-text">PUL<span class="logo-new">NEW</span>.COM</div>
            </a>
            <a href="https://pulnew.pages.dev/" class="btn-beranda">← Beranda</a>
        </div>
    </div>

    <div class="content-wrapper"><div class="article-box" id="content-area"><div class="loading">Memuat berita...</div></div></div>

    <div class="footer-ticker"><div class="ticker-content" id="running-text">MEMUAT INFORMASI TERKINI...</div></div>

<script>
let allPosts = [];
const baseURL = 'https://pulnew.pages.dev';

function updateMetaTags(post) {
    document.title = post.title + " - PULNEW.com";
    const setMeta = (attr, val, content) => {
        let meta = document.querySelector(`meta[${attr}="${val}"]`);
        if (!meta) { meta = document.createElement('meta'); meta.setAttribute(attr, val); document.head.appendChild(meta); }
        meta.setAttribute('content', content);
    };
    const desc = (post.body || post.content || '').substring(0, 160).replace(/<[^>]*>/g, '') + '...';
    setMeta('property', 'og:title', post.title);
    setMeta('property', 'og:description', desc);
    setMeta('property', 'og:image', post.image || post.thumbnail || '/media/og-default.jpg');
    setMeta('property', 'og:url', window.location.href);
    setMeta('name', 'twitter:title', post.title);
    setMeta('name', 'twitter:description', desc);
    setMeta('name', 'twitter:image', post.image || post.thumbnail || '/media/og-default.jpg');
}

function copyLink() {
    navigator.clipboard.writeText(window.location.href);
    alert("✅ Link berita sudah disalin!");
}

async function fetchPosts() {
    const res = await fetch('/api/posts?t=' + Date.now() + '&r=' + Math.random(), { cache: 'no-store', headers: { 'Cache-Control': 'no-cache' } });
    if(!res.ok) throw new Error("Gagal fetch /api/posts");
    const data = await res.json();
    return Array.isArray(data)? data : data.urls || [];
}

async function fetchPostDetail(url) {
    try {
        const res = await fetch(url + '?t=' + Date.now() + '&r=' + Math.random(), { cache: 'no-store' });
        const data = await res.json();
        if (!data.slug || data.slug.trim() === "") {
            data.slug = data.title
            .toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .replace(/\s+/g, '-')
            .substring(0, 100);
        }
        return data;
    } catch {
        return null;
    }
}

async function muatHalamanBerita() {
    const slugTujuan = new URLSearchParams(window.location.search).get('slug');
    const contentArea = document.getElementById('content-area');

    if (!slugTujuan) {
        contentArea.innerHTML = `<div class="error">404 - Link Tidak Valid<br><a href="/">Kembali ke Beranda</a></div>`;
        return;
    }

    try {
        const urls = await fetchPosts();
        const posts = await Promise.all(urls.slice(0, 40).map(url => fetchPostDetail(url))).then(results => results.filter(Boolean));
        allPosts = posts;
        posts.sort((a, b) => new Date(b.date || b.created_at) - new Date(a.date || a.created_at));

        const post = posts.find(p => p.slug && p.slug.toLowerCase() === slugTujuan.toLowerCase());

        if (!post) {
            contentArea.innerHTML = `<div class="error">404 - Berita Tidak Ditemukan<br><small>Mungkin sudah dihapus</small><br><br><a href="/">← Kembali ke Beranda</a></div>`;
            document.getElementById('running-text').textContent = "INFO NEWS: Berita tidak ditemukan";
            return;
        }

        updateMetaTags(post);

        const tanggal = new Date(post.date || post.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        const isiBerita = post.body || post.content || '';
        const linkBerita = window.location.href;
        const textShare = encodeURIComponent(post.title + ' - ' + linkBerita);

        const sourceBox = post.source_name? `
            <div class="source-box">
                Sumber: <a href="${post.source_url}" target="_blank" rel="noopener noreferrer">${post.source_name}</a>
            </div>
        ` : '';

        let html = `
            <h1 class="article-title">${post.title}</h1>
            <div class="article-meta">${tanggal} WIB | ${(post.kategori || post.Kategori || post.category || 'BERITA').toUpperCase()}</div>

            <img src="${post.image || post.thumbnail || '/media/og-default.jpg'}" class="main-image" alt="${post.title}" loading="lazy">

            <div class="share-article">
                <a href="https://wa.me/?text=${textShare}" target="_blank" class="share-wa"><i class="fab fa-whatsapp"></i> WhatsApp</a>
                <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(linkBerita)}" target="_blank" class="share-fb"><i class="fab fa-facebook"></i> Facebook</a>
                <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(post.title)}&url=${encodeURIComponent(linkBerita)}" target="_blank" class="share-x"><i class="fab fa-x-twitter"></i> X</a>
                <button onclick="copyLink()" class="share-copy"><i class="fas fa-link"></i> Salin Link</button>
            </div>

            <div class="article-body">${isiBerita}</div>

            ${sourceBox}
        `;

        const related = posts.filter(p => p.slug!== post.slug).slice(0, 5);
        if (related.length > 0) {
            html += `<div class="related-section"><div class="section-title">Berita Lainnya</div>`;
            related.forEach(r => {
                html += `<a href="/berita.html?slug=${r.slug}" class="related-item"><img src="${r.image || r.thumbnail || '/media/og-default.jpg'}" alt="${r.title}"><h4>${r.title}</h4></a>`;
            });
            html += `</div>`;
        }
        contentArea.innerHTML = html;
        document.getElementById('running-text').textContent = `INFO NEWS: ${post.title} | PULNEW.com`;

    } catch (e) {
        console.error(e);
        contentArea.innerHTML = `<div class="error">Gagal memuat berita.<br><small>Coba refresh</small><br><br><a href="/">← Kembali ke Beranda</a></div>`;
    }
}
document.addEventListener('DOMContentLoaded', muatHalamanBerita);

</script>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
    //let player;
    //let youtubeLink = 'https://youtube.com/watch?v=YLxO9527zYA'; // GANTI LINK KAMU
    //let currentVideoId = youtubeLink.split('v=')[1];

    function onYouTubeIframeAPIReady() {
        const savedTime = localStorage.getItem('yt_currentTime') || 0;
        const savedVideo = localStorage.getItem('yt_videoId');

        player = new YT.Player('youtube-player', {
           videoId: savedVideo || currentVideoId,
           playerVars: {
              'playsinline': 1,
              'controls': 1,
              'rel': 0,
              'mute': 1,
              'start': parseInt(savedTime)
           },
           events: {
              'onReady': e => {
                 e.target.playVideo();
                 setTimeout(() => e.target.unMute(), 1000);
               },
              'onStateChange': saveTime
           }
         });
    }

    function saveTime() {
        if(player && player.getCurrentTime){
            setInterval(() => {
                localStorage.setItem('yt_currentTime', player.getCurrentTime());
                localStorage.setItem('yt_videoId', player.getVideoData().video_id);
            }, 1000);
        }
    }

    // HAPUS SEMUA KODE SCROLL. BIAR STABIL AJA
    document.getElementById('close-video').addEventListener('click', () => {
      if(player) player.pauseVideo();
      localStorage.removeItem('yt_currentTime');
      document.querySelector('.sticky-video-wrapper').style.display = 'none';
    });
    </script>
