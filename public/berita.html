<!DOCTYPE html>
<html lang="id">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULNEW - Detail Berita</title>
    <meta property="og:title" content="PULNEW.com - Update Informasi Terkini">
    <meta property="og:image" content="https://pulnew.pages.dev/media/og-default.jpg">
    <meta property="og:url" content="">
    <meta property="og:type" content="article">
    
    <style>
        :root { --warna-merah: #d32f2f; --warna-biru: #1a237e; --warna-bg: #f4f6f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        html, body { background: var(--warna-bg); color: #333; min-height: 100vh; padding-bottom: 60px; }
        .header-container { background: #ffffff; position: sticky; top: 0; z-index: 200; border-bottom: 2px solid var(--warna-merah); }
        .logo-bar { max-width: 1100px; margin: 0 auto; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-text { font-size: 24px; font-weight: 800; color: var(--warna-biru); }
        .logo-new { color: var(--warna-merah); }
        .btn-beranda { background: #2e7d32; color: white; padding: 5px 12px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold; }
        .content-wrapper { padding: 15px; }
        .article-box { max-width: 600px; margin: 0 auto; }
        .main-image { width: 100%; border-radius: 6px; margin: 15px 0; display: block; }
        .footer-ticker { background: #d32f2f; color: white; padding: 8px 0; font-size: 13px; overflow: hidden; width: 100%; position: fixed; bottom: 0; left: 0; z-index: 999; }
        .ticker-content { display: inline-block; white-space: nowrap; padding-left: 100%; animation: ticker 40s linear infinite; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        .related-section { margin-top: 30px; border-top: 2px solid #ddd; padding-top: 15px; }
        .related-item { display: flex; gap: 12px; padding: 10px 0; text-decoration: none; color: #333; border-bottom: 1px solid #eee; }
        .related-item img { width: 80px; height: 60px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
        .related-item h4 { font-size: 14px; line-height: 1.3; }
    </style>
</head>
<body>

<div class="header-container">
    <div class="logo-bar">
        <a href="/" style="text-decoration:none;"><div class="logo-text">PUL<span class="logo-new">NEW</span>.COM</div></a>
        <a href="/" class="btn-beranda">← Beranda</a>
    </div>
</div>

<div class="content-wrapper">
    <div class="article-box" id="content-area">Memuat berita...</div>
</div>

<div class="footer-ticker">
    <div class="ticker-content" id="running-text">MEMUAT INFORMASI TERKINI...</div>
</div>

<script>
    async function muatHalamanBerita() {
        const slug = new URLSearchParams(window.location.search).get('slug');
        const area = document.getElementById('content-area');
        const ticker = document.getElementById('running-text');

        if (!slug) { area.innerHTML = "Berita tidak ditemukan."; return; }

        try {
            const res = await fetch('/posts.json?t=' + Date.now());
            const data = await res.json();
            const post = data.find(p => p.slug === slug);

            if (!post) { area.innerHTML = "Berita tidak ditemukan."; return; }

            // Update Meta dengan aman
            document.title = post.title;
            const updateMeta = (prop, val) => {
                let el = document.querySelector(`meta[property="${prop}"]`);
                if(el) el.content = val;
            };
            updateMeta('og:title', post.title);
            updateMeta('og:image', post.image);
            updateMeta('og:url', window.location.href);

            // Render Konten + Fallback Gambar
            area.innerHTML = `
                <h1 style="font-size:22px; margin-bottom:15px; line-height:1.3;">${post.title}</h1>
                <img src="${post.image}" class="main-image" onerror="this.src='https://pulnew.pages.dev/media/og-default.jpg'">
                <div style="margin:15px 0;">
                    <a href="https://wa.me/?text=Baca: ${window.location.href}" style="background:#25D366; color:white; padding:10px 20px; text-decoration:none; border-radius:5px; font-weight:bold; display:inline-block;">📲 Share ke WhatsApp</a>
                </div>
                <div style="line-height:1.7; font-size:16px;">${post.body.replace(/\n/g, '<br>')}</div>
                <div class="related-section" id="related"><h3>Berita Lainnya</h3></div>
            `;

            ticker.textContent = `INFO NEWS: ${post.title} | PULNEW.COM - Update Informasi Terkini`;

            // Render Related
            const relatedContainer = document.getElementById('related');
            data.filter(p => p.slug !== slug).slice(0, 3).forEach(r => {
                relatedContainer.innerHTML += `
                    <a href="/berita.html?slug=${r.slug}" class="related-item">
                        <img src="${r.image}" onerror="this.src='https://pulnew.pages.dev/media/og-default.jpg'">
                        <h4>${r.title}</h4>
                    </a>`;
            });

        } catch (e) { area.innerHTML = "Gagal memuat berita."; }
    }
    muatHalamanBerita();
</script>
</body>
</html>
