<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat... - PULNEW</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta property="og:image" content="https://pulnew.pages.dev/media/og-default.jpg">
    <style>
        body { margin:0; background:#f4f6f9; font-family: Arial, sans-serif; padding-bottom: 45px;}
        .header { background: #fff; padding: 10px 20px; border-bottom: 3px solid #d32f2f; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0;}
        .logo { font-family: 'Poppins'; font-size: 24px; font-weight: 800; color: #1a237e; text-decoration:none;}
        .logo span { color: #d32f2f;}
        .btn { background: #2e7d32; color: white; padding: 5px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight:600;}
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px;}
        .title { font-family: 'Poppins'; font-size: 26px; font-weight: 800; line-height: 1.3; margin-bottom: 10px;}
        .meta { font-size: 12px; color: #666; margin-bottom: 15px;}
        .main-img { width: 100%; border-radius: 8px; margin-bottom: 15px;}
        .body { font-size: 16px; line-height: 1.7;}
        .related { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px;}
        .related h3 { font-family: 'Poppins'; border-left: 4px solid #d32f2f; padding-left: 10px; color: #1a237e;}
        .related-item { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid #f0f0f0; text-decoration:none; color:#333;}
        .related-item img { width:90px; height:60px; object-fit:cover; border-radius:6px;}
        .footer { background: #d32f2f; color: white; text-align: center; padding: 10px; position: fixed; bottom: 0; width: 100%;}
        .loading { text-align:center; padding:50px;} .error{color:red}
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="logo">PUL<span>NEW</span>.COM</a>
        <a href="/" class="btn">← Beranda</a>
    </div>
    <div class="container" id="content-area"><div class="loading">Memuat berita...</div></div>
    <div class="footer" id="running-text">MEMUAT INFO TERKINI...</div>

<script>
const BASE = 'https://pulnew.pages.dev';
const slug = window.location.pathname.split('/').pop().replace('.html','');

async function load() {
    const area = document.getElementById('content-area');
    if(!slug) { area.innerHTML = '<h1>404</h1>'; return; }

    try {
        // CEK DULU APA BENERAN JSON
        const res = await fetch(`${BASE}/posts/${slug}.json?t=${Date.now()}`);
        const text = await res.text(); // baca sebagai text dulu
        if(text.startsWith('<')) throw new Error("File JSON tidak ditemukan. Cek nama file di folder /posts/");
        
        const post = JSON.parse(text); // baru parse

        // UPDATE META
        document.title = post.title + ' - PULNEW';
        document.querySelector('meta[property="og:image"]').content = BASE + post.image;

        // TAMPILKAN
        const tgl = new Date(post.date).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});
        area.innerHTML = `
            <h1 class="title">${post.title}</h1>
            <div class="meta">${tgl} WIB | ${post.kategori.toUpperCase()}</div>
            <img src="${BASE + post.image}" class="main-img" onerror="this.src='${BASE}/media/og-default.jpg'">
            <div class="body"><p>${post.lead}</p></div>
            <div class="related"><h3>BERITA LAINNYA</h3><div id="lainnya">Memuat...</div></div>
        `;
        document.getElementById('running-text').innerText = 'INFO: ' + post.title;

        // BERITA LAINNYA
        const res2 = await fetch(`${BASE}/posts/index.json?t=${Date.now()}`);
        const posts = await res2.json();
        const lain = posts.filter(p => p.slug !== slug).slice(0,3);
        document.getElementById('lainnya').innerHTML = lain.map(p => `
            <a href="/berita/${p.slug}.html" class="related-item">
                <img src="${BASE + p.image}" onerror="this.src='${BASE}/media/og-default.jpg'">
                <h4>${p.title}</h4>
            </a>
        `).join('');

    } catch(e) {
        area.innerHTML = `<h1 class="error">Gagal Muat</h1><p>${e.message}</p><p>Slug: ${slug}</p>`;
    }
}
load();
</script>
</body>
</html>
