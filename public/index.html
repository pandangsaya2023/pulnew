<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULNEW - Portal Info Terkini</title>
    <meta name="description" content="Menyajikan Informasi Langsung Ke Perangkat Anda - Portal informasi Indonesia terupdate">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"></noscript>
    <link rel="preload" as="image" href="/media/og-image.webp" fetchpriority="high">
    <link rel="icon" type="image/ico" href="https://pulnew.pages.dev/favicon.ico">
    <meta property="og:image" content="https://pulnew.pages.dev/media/og-image.webp">
    <style>
        :root { --jarak-utama: 12px; --warna-merah: #d32f2f; --warna-biru: #1a237e; --warna-bg: #f4f6f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; }
        html, body { background: var(--warna-bg); color: #333; min-height: 100vh; }
        h1, h2, h3, h4,.logo-text { font-family: 'Poppins', sans-serif; }
       .header-container { background: #ffffff; position: sticky; top: 0; z-index: 200; border-bottom: 2px solid var(--warna-merah); }
       .logo-bar { max-width: 1100px; margin: 0 auto; padding: 7px 20px; display: flex; justify-content: space-between; align-items: center; min-height: 59px; }
       .logo-bar > a { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
       .logo-img-wrapper img { display: block; width:45px; height:45px; }
       .logo-text { font-size: 24px; font-weight: 800; color: var(--warna-biru); }
       .logo-new { color: var(--warna-merah); }
       .category-nav { display: flex; gap: 8px; overflow-x: auto; padding: 6px 10px; background: var(--warna-biru); position: sticky; top: 55px; z-index: 100; scrollbar-width: none; min-height: 38px; }
       .category-nav::-webkit-scrollbar { display: none; }
       .category-nav a { padding: 5px 10px; background: #1a237e; border-radius: 10px; font-size: 10.5px; font-weight: 600; color: white; text-decoration: none; white-space: nowrap; }
       .category-nav a.active { background: #d32f2f; }
       .top-header { background: var(--warna-biru); color: white; padding: 0 12px; display: flex; align-items: center; gap: 10px; font-size: 11px; position: sticky; top: 93px; z-index: 199; min-height: 28px; }
       .breaking-badge { background: var(--warna-biru); color: white; padding: 2px 8px; border-radius: 8px; font-weight: 700; font-size: 10px; }
       .ticker-wrapper { overflow: hidden; width: 100%; height: 28px; display:flex; align-items:center; }
       .ticker-content { display: inline-block; white-space: nowrap; padding-left: 100%; animation: ticker 120s linear infinite; }
       .ticker-item { display: inline-block; padding-right: 40px; color: white; text-decoration: none; }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
       .container { max-width: 1100px; margin: 0 auto; padding: var(--jarak-utama) 10px; }
       .search-box { margin: 10px 0; }
       .search-box input { width:100%; padding:12px 16px; border:2px solid #ddd; border-radius:12px; font-size:14px; outline:none; }
       .news-hero { position: relative; border-radius: 12px; overflow: hidden; margin-bottom: var(--jarak-utama); display: block; text-decoration:none; background:#ddd; min-height:240px; }
       .news-hero img { width: 100%; height: 240px; object-fit: cover; display: block; background:#e0e0e0; }
       .hero-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 16px; background: linear-gradient(transparent, rgba(0,0,0,0.85)); color: white; }
       .news-hero h2 { font-size: 16px; font-weight: 700; line-height: 1.3; color: white; }
       .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-bottom: 8px; color: white; }
       .news-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--jarak-utama); }
       .news-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-decoration:none; color:inherit; }
       .news-card img { width: 100%; height: 180px; object-fit: cover; background:#e0e0e0; }
       .card-content { padding: 12px 14px 16px; }
       .news-card h3 { font-size: 15px; font-weight: 700; line-height: 1.4; color: #111; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
       .section-title { font-size: 18px; font-weight: 800; color: var(--warna-biru); margin: 22px 0 15px; padding-left: 8px; border-left: 4px solid var(--warna-merah); }
       .latest-carousel { overflow: hidden; }
       .carousel-scroll { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
       .carousel-scroll::-webkit-scrollbar { display: none; }
       .carousel-item { flex: 0 0 80%; max-width: 500px; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-decoration: none; color: inherit; display: flex; gap: 12px; padding: 10px; }
       .carousel-item img { width: 40%; height: 120px; object-fit: cover; border-radius: 8px; background:#e0e0e0; }
        @media (max-width: 600px) {.news-grid { grid-template-columns: 1fr; } }
        footer { background: #101726; color: #e5e7eb; padding: 16px 20px; font-size: 13px; border-top: 4px solid var(--warna-biru); }
       .footer-content { max-width: 1100px; margin: 0 auto; text-align: center; }
       .footer-logo { font-size: 20px; font-weight: 800; color: white; margin-bottom: 4px; }
       .footer-logo span { color: var(--warna-merah); }
       .footer-bottom { border-top: 1px solid #1e293b; padding-top: 10px; margin-top: 10px; font-size: 11.5px; color: #d1d5db; }
       .footer-link { color: #e5e7eb; text-decoration: none; margin: 0 5px; }
       .pagination { display:flex; justify-content:center; gap:8px; margin-top:20px; flex-wrap:wrap; }
       .pagination button { padding:8px 14px; border:1px solid #ddd; background:white; border-radius:8px; cursor:pointer; font-weight:600; }
       .pagination button.active { background:var(--warna-merah); color:white; }
    </style>
</head>
<body>
    <div class="header-container"><div class="logo-bar"><a href="/"><div class="logo-img-wrapper"><img src="/logopulnew.png" alt="Logo PULNEW" width="45" height="45" decoding="async"></div><div class="logo-text">PUL<span class="logo-new">NEW</span></div></a><div style="font-size:12px;font-weight:700;" id="live-date"></div></div></div>
    <div class="category-nav"><a href="#" class="active" data-kategori="SEMUA">Beranda</a><a href="#" data-kategori="NASIONAL">Nasional</a><a href="#" data-kategori="POLITIK">Politik</a><a href="#" data-kategori="EKONOMI">Ekonomi</a><a href="#" data-kategori="TEKNOLOGI">Teknologi</a><a href="#" data-kategori="KESEHATAN">Kesehatan</a><a href="#" data-kategori="PENDIDIKAN">Pendidikan</a><a href="#" data-kategori="HUKUM">Hukum</a><a href="#" data-kategori="OLAHRAGA">Olahraga</a><a href="#" data-kategori="HIBURAN">Hiburan</a></div>
    <div class="top-header"><div class="breaking-badge">INFO NEW ➡️</div><div class="ticker-wrapper"><div class="ticker-content" id="running-text-container"><span class="ticker-item">Memuat berita terbaru...</span></div></div></div>
    <main class="container"><div class="search-box"><input type="text" id="searchInput" placeholder="🔍 Cari judul berita..." autocomplete="off"></div><div id="news-container"><div style="text-align:center;padding:40px;">Memuat...</div></div><div id="pagination-container" class="pagination"></div></main>
    <footer><div class="footer-content"><div class="footer-logo">PUL<span>NEW</span></div><p>Menyajikan informasi langsung ke perangkat anda</p><div style="margin-top:8px;"><a href="/about.html" class="footer-link">Tentang</a> | <a href="/privacy.html" class="footer-link">Privacy</a> | <a href="/pedoman-media-siber.html" class="footer-link">Pedoman Media Siber</a> | <a href="/contact.html" class="footer-link">Kontak</a></div><div class="footer-bottom">&copy; 2026 PULNEW All Rights Reserved.</div></div></footer>
<script>
document.getElementById('live-date').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
let allPosts=[], filteredPosts=[], currentPage=1; const postsPerPage=12;
const kategoriWarna={'NASIONAL':'#1a237e','POLITIK':'#1a237e','EKONOMI':'#f57c00','TEKNOLOGI':'#0288d1','PENDIDIKAN':'#2e7d32','HUKUM':'#6a1b9a','HIBURAN':'#d32f2f','OLAHRAGA':'#d32f2f','KESEHATAN':'#009688','BERITA':'#d32f2f'};
function bisaTayang(t){const s=new Date();const w=new Date(t);return w<=s;}
async function fetchPosts(){const r=await fetch('/posts/index.json');return r.json();}
async function ambilDataBerita(){
  const posts=await fetchPosts();
  const tayang=posts.filter(p=>bisaTayang(p.date)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  allPosts=tayang; filteredPosts=tayang; tampilkanHalaman(1); updateRunningText(tayang); setupKategori(); setupSearch();
}
function getOptimizedImage(url,width){
  if(!url) return '/media/og-image.webp';
  try{
    if(url.includes('pulnew.pages.dev')){
      return `/cdn-cgi/image/width=${width},quality=65,format=auto,fit=cover${url.replace(/^https:\/\/pulnew.pages.dev/,'')}`;
    }
    // Kalau Image Resizing belum aktif, ini bakal error -> fallback ke url asli tapi tetap kecil
    // Aktifin di Cloudflare: Speed > Optimization > Image Resizing ON + Resize from any origin ON
    return `/cdn-cgi/image/width=${width},quality=60,format=auto,fit=cover/${url}`;
  }catch(e){return url;}
}
function tampilkanBerita(posts){
  const c=document.getElementById('news-container'); if(!posts.length){c.innerHTML='<div style="text-align:center;padding:40px;">Tidak ada berita</div>';return;}
  let html='';
  const hero=posts[0]; const katHero=(hero.kategori||'BERITA').toUpperCase(); const warnaHero=kategoriWarna[katHero]||'#d32f2f';
  html+=`<a href="/berita.html?slug=${hero.slug}" class="news-hero"><img src="${getOptimizedImage(hero.image,640)}" alt="${hero.title}" width="640" height="360" fetchpriority="high" decoding="async" onerror="this.src='/media/og-image.webp'"><div class="hero-content"><span class="badge" style="background:${warnaHero}">${katHero}</span><h2>${hero.title}</h2></div></a>`;
  if(posts.length>1){html+='<div class="news-grid">';posts.slice(1,5).forEach(p=>{const k=(p.kategori||'BERITA').toUpperCase();html+=`<a href="/berita.html?slug=${p.slug}" class="news-card"><img src="${getOptimizedImage(p.image,400)}" alt="${p.title}" width="400" height="225" loading="lazy" decoding="async" onerror="this.src='/media/og-image.webp'"><div class="card-content"><span class="badge" style="background:${kategoriWarna[k]||'#d32f2f'}">${k}</span><h3>${p.title}</h3></div></a>`;});html+='</div>';}
  if(posts.length>5){html+='<h3 class="section-title">🔥 Trending</h3><div class="latest-carousel"><div class="carousel-scroll">';posts.slice(5).forEach(p=>{const k=(p.kategori||'BERITA').toUpperCase();html+=`<a href="/berita.html?slug=${p.slug}" class="carousel-item"><img src="${getOptimizedImage(p.image,200)}" alt="${p.title}" width="200" height="150" loading="lazy" decoding="async" onerror="this.src='/media/og-image.webp'"><div><span class="badge" style="background:${kategoriWarna[k]||'#d32f2f'}">${k}</span><h4 style="font-size:14px;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${p.title}</h4></div></a>`;});html+='</div></div>';}
  c.innerHTML=html;
}
function tampilkanHalaman(p){currentPage=p;const s=(p-1)*postsPerPage;const e=s+postsPerPage;tampilkanBerita(filteredPosts.slice(s,e));renderPagination();window.scrollTo({top:0,behavior:'smooth'});}
function renderPagination(){const t=Math.ceil(filteredPosts.length/postsPerPage);const c=document.getElementById('pagination-container');if(t<=1){c.innerHTML='';return;}let h=`<button onclick="tampilkanHalaman(${currentPage-1})" ${currentPage==1?'disabled':''}>«</button>`;for(let i=Math.max(1,currentPage-1);i<=Math.min(t,currentPage+1);i++)h+=`<button class="${i==currentPage?'active':''}" onclick="tampilkanHalaman(${i})">${i}</button>`;h+=`<button onclick="tampilkanHalaman(${currentPage+1})" ${currentPage==t?'disabled':''}>»</button>`;c.innerHTML=h;}
function setupSearch(){document.getElementById('searchInput').addEventListener('input',e=>{const k=e.target.value.toLowerCase();filteredPosts=k==''?allPosts:allPosts.filter(p=>p.title.toLowerCase().includes(k));tampilkanHalaman(1);});}
function setupKategori(){document.querySelectorAll('.category-nav a').forEach(a=>{a.addEventListener('click',e=>{e.preventDefault();document.querySelectorAll('.category-nav a').forEach(x=>x.classList.remove('active'));a.classList.add('active');filteredPosts=a.dataset.kategori=='SEMUA'?allPosts:allPosts.filter(p=>(p.kategori||'').toUpperCase()==a.dataset.kategori);tampilkanHalaman(1);});});}
function updateRunningText(posts){const el=document.getElementById('running-text-container');let h='';posts.slice(0,8).forEach(p=>{h+=`<a href="/berita.html?slug=${p.slug}" class="ticker-item">🔥 ${p.title}</a>`;});el.innerHTML=h;}
ambilDataBerita();
// Delay AdSense biar gak bikin LCP 5.1 dtk + JS 149 KiB
window.addEventListener('load',()=>{setTimeout(()=>{var s=document.createElement('script');s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8902628805606588';s.crossOrigin='anonymous';s.async=true;document.head.appendChild(s);},1500);});
</script>
</body>
</html>
