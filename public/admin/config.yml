backend:
  name: github
  repo: pandangsaya2023/pulnew
  branch: main

media_folder: "public/media"
public_folder: "/media"

collections:
  - name: "posts"
    label: "Berita"
    folder: "public/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "json"
    format: "json"
    editor:
      preview: true
    fields:
      - {label: "Judul", name: "title", widget: "string", required: true}
      - {label: "Slug", name: "slug", widget: "string", required: true, hint: "huruf-kecil-tanpa-spasi"}
      - {label: "Kategori", name: "kategori", widget: "select", options: ["NASIONAL", "POLITIK", "EKONOMI", "PENDIDIKAN", "HUKUM","TEKNOLOGI", "OLAHRAGA", "KESEHATAN", "HIBURAN"], required: true}
      - {label: "Tanggal", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ", required: true}
      - {label: "Gambar Utama", name: "image", widget: "image", required: false}
      #- {label: "Sumber Media", name: "source_name", widget: "string", required: false, hint: "Contoh: Kompas, Detik"}
      #- {label: "Link Sumber", name: "source_url", widget: "string", required: false}
      - {label: "Isi Berita", name: "body", widget: "markdown", required: true}
    view_filters:
      - {label: "Terbaru", field: "date", pattern: ""}
    view_groups:
      - {label: "Per Kategori", field: "kategori"}
    sort: "date"
    sort_direction: "descending"

  - name: "index" # INI BUAT NGATUR INDEX.JSON
    label: "Daftar Berita"
    description: "Atur urutan berita di beranda & berita lainnya"
    files:
      - label: "Index Berita"
        name: "index"
        file: "public/posts/index.json"
        fields:
          - label: "Daftar File Berita"
            name: "files"
            widget: "list"
            field:
              label: "Nama File JSON"
              name: "file"
              widget: "string"
              hint: "Contoh: judul-berita-05-08-2026.json"
